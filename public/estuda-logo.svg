  <g aria-hidden="true" transform="rotate(-13 318 66)" stroke="#075e9e" stroke-linejoin="round" stroke-width="2">
    <path d="M300 51h11v39h-11z" fill="url(#book)" />
    <path d="M311 48h11v39h-11z" fill="#f6cf21" />
    <path d="M322 54h10v34h-10z" fill="#16c8df" />
