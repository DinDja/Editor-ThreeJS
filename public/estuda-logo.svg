<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 128" role="img" aria-labelledby="title description">
  <title id="title">Estuda</title>
  <desc id="description">Juntos aprendemos mais</desc>
  <defs>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29d7eb" />
      <stop offset="1" stop-color="#0785cf" />
    </linearGradient>
    <filter id="word-shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#101828" flood-opacity=".6" />
    </filter>
  </defs>

  <g aria-hidden="true" stroke="#fff" stroke-linejoin="round" stroke-width="3">
    <path d="M25 7v9H16v9h9v9h9v-9h9v-9h-9V7z" fill="#0785cf" />
  </g>

  <text
